<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hard Dog — vanilla JavaScript Canvas 2D side-scroller game."
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <title>Hard Dog — 2D Game</title>
  </head>
  <body>
    <main class="game-shell" aria-label="Hard Dog 2D game">
      <canvas
        id="game-canvas"
        class="game-canvas"
        aria-label="Игровое поле Hard Dog"
      ></canvas>
      <noscript>Для запуска игры нужен включённый JavaScript.</noscript>
    </main>

    <script src="./src/main.js" type="module"></script>
  </body>
</html>
